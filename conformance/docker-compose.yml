# OpenID Foundation conformance suite against the package's demo provider.
#
# Run with ./conformance/run.sh (it pulls the images, starts this stack,
# runs the Basic OP and Config OP plans and tears everything down).
#
# The client IDs and secrets below exist only inside this throwaway stack.

name: openid-provider-conformance

services:
  mongodb:
    image: mongo:6.0.13
    tmpfs:
      - /data/db
    mem_limit: 768m

  server:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.3.4
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: -Xmx1200m
      OIDC_GOOGLE_CLIENTID: unused
      OIDC_GOOGLE_SECRET: unused
      OIDC_GITLAB_CLIENTID: unused
      OIDC_GITLAB_SECRET: unused
    depends_on:
      - mongodb
    mem_limit: 1800m

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.4
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk
    depends_on:
      - server
    mem_limit: 128m

  # The demo provider (Testbench workbench) served by PHP's built-in server.
  op:
    image: php:8.4-cli
    volumes:
      - ..:/src:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:Y29uZm9ybWFuY2Utb25seS1hcHAta2V5LTMyYnl0ZXM=
      APP_URL: https://op.openid.test
      OPENID_PROVIDER_ISSUER: https://op.openid.test
      PHP_CLI_SERVER_WORKERS: "4"
      DEMO_USER_EMAIL: ada@example.com
      DEMO_USER_PASSWORD: correct-horse-battery
      DEMO_CLIENTS: >-
        3f6a8f4e-2b1c-4d7e-9a5f-0c1d2e3f4a5b|conformance-secret-one-4f8a1c7e9b2d6f3a5c8e|Conformance client one|https://localhost.emobix.co.uk:8443/test/a/laravel-openid-provider/callback;7b2c9d1e-5f4a-4e3b-8c6d-1a2b3c4d5e6f|conformance-secret-two-9e3b7d1f5a2c8e4b6d0f|Conformance client two|https://localhost.emobix.co.uk:8443/test/a/laravel-openid-provider/callback
      # Client two skips consent; client one always shows the consent screen.
      DEMO_SKIP_CONSENT_CLIENTS: 7b2c9d1e-5f4a-4e3b-8c6d-1a2b3c4d5e6f
    command: ["sh", "/src/conformance/op-entrypoint.sh"]
    mem_limit: 768m

  # TLS termination for the provider, reachable as https://op.openid.test.
  op-tls:
    image: caddy:2.8
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - op.openid.test
    depends_on:
      - op
    mem_limit: 128m

  # Runs scripts/run-test-plan.py from the conformance suite at the same tag.
  runner:
    image: python:3.12-slim
    profiles: ["runner"]
    working_dir: /suite/scripts
    volumes:
      - ./.runtime/suite:/suite:ro
      - ./.runtime/results:/results
      - ./config:/config:ro
      - ./expected-warnings.json:/expected/warnings.json:ro
      - ./expected-skips.json:/expected/skips.json:ro
    environment:
      CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443/
      CONFORMANCE_SERVER_MTLS: https://localhost.emobix.co.uk:8444/
      CONFORMANCE_DEV_MODE: "1"
    mem_limit: 256m
